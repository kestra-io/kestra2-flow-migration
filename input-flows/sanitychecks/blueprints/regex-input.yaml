id: regex-input
namespace: sanitychecks
inputs:
  - id: age
    type: INT
    defaults: 42
    required: true
    min: 18
    max: 64
  - id: user
    type: STRING
    defaults: student
    required: true
    validator: ^student(\d+)?$
tasks:
  - id: validator
    type: io.kestra.plugin.core.log.Log
    message: User {{ inputs.user }}, age {{ inputs.age }}
