name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  tag:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: kestra-io/actions/composite/checkout-and-auth@main
        with:
          gh-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator conventional-changelog-conventionalcommits

      # Tags pushed with the default GITHUB_TOKEN do not trigger other
      # workflows (GitHub recursion guard), so the Release workflow would
      # never run. Push the tag with a GitHub App token instead.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release
