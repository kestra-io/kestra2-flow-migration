id: hubspot-postgres-sync
namespace: company.team
tasks:
  - id: each
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ trigger.rows }}"
    tasks:
      - id: create_contact_in_hubspot
        type: io.kestra.plugin.hubspot.contacts.Create
        apiKey: "{{ secret('HUBSPOT_API_KEY') }}"
        email: "{{ fromJson(taskrun.value).Email }}"
        firstName: "{{ fromJson(taskrun.value).FirstName }}"
        lastName: "{{ fromJson(taskrun.value).LastName }}"
        phone: "{{ fromJson(taskrun.value).Phone }}"
        jobTitle: "{{ fromJson(taskrun.value).JobTitle }}"

triggers:
  - id: postgres_trigger
    type: io.kestra.plugin.jdbc.postgresql.Trigger
    sql: |
      SELECT 
        first_name as "FirstName", 
        last_name as "LastName", 
        email as "Email",
        phone as "Phone",
        job_title as "JobTitle"
      FROM customers
      WHERE updated_at > CURRENT_DATE - INTERVAL '1 day'
      AND (processed_at IS NULL OR processed_at < updated_at)
    interval: PT5M
    fetchType: FETCH

pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: "{{ secret('POSTGRES_URL') }}"
      username: "{{ secret('POSTGRES_USERNAME') }}"
      password: "{{ secret('POSTGRES_PASSWORD') }}"

