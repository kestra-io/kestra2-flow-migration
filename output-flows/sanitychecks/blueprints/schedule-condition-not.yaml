id: schedule-condition-not
namespace: sanitychecks
tasks:
  - id: hello
    type: io.kestra.plugin.core.log.Log
    message: Demo for Not condition
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 11 * * *"
    when: "{{ not (dayOfWeek(trigger.date) == 'MONDAY') }}"
