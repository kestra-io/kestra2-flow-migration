id: schedule-condition-dayweek
namespace: sanitychecks
tasks:
  - id: hello
    type: io.kestra.plugin.core.log.Log
    message: Demo for DayWeek condition
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 11 * * *"
    when: "{{ dayOfWeek(trigger.date) == 'MONDAY' }}"
