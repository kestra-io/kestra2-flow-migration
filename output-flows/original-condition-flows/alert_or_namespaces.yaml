id: alert
namespace: company.system

tasks:
  - id: send
    type: io.kestra.plugin.slack.notifications.SlackExecution
    url: "{{ secret('SLACK_WEBHOOK') }}"
    channel: "#general"
    executionId: "{{trigger.executionId}}"

triggers:
  - id: listen
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - when: "{{ (flow.namespace | startsWith('company.product')) or (flow.id == 'cleanup' and flow.namespace == 'company.system') }}"
        states:
          - FAILED
          - WARNING
